services:
  _defaults:
    autowire: true
    autoconfigure: true

  logger.channel.ai_guidance:
    parent: logger.channel_base
    arguments: ['ai_guidance']

  ai_guidance.redactor:
    class: Drupal\ai_guidance\Prompt\GuidanceRedactor

  ai_guidance.markdown_parser:
    class: Drupal\ai_guidance\Source\MarkdownGuidanceParser

  ai_guidance.state_aggregator:
    class: Drupal\ai_guidance\State\GuidanceStateAggregator
    arguments:
      $providers: !tagged_iterator guidance_state_provider
      $redactor: '@ai_guidance.redactor'
      $logger: '@logger.channel.ai_guidance'

  Drupal\ai_guidance\State\GuidanceStateAggregator: '@ai_guidance.state_aggregator'

  ai_guidance.domain_classifier:
    class: Drupal\ai_guidance\Evidence\GuidanceDomainClassifier

  ai_guidance.evidence_collector:
    class: Drupal\ai_guidance\Evidence\GuidanceEvidenceCollector
    arguments:
      $classifier: '@ai_guidance.domain_classifier'
      $providers: !tagged_iterator guidance_evidence_provider
      $logger: '@logger.channel.ai_guidance'

  Drupal\ai_guidance\Evidence\GuidanceEvidenceCollector: '@ai_guidance.evidence_collector'

  ai_guidance.evidence_citation_provider:
    class: Drupal\ai_guidance\Evidence\GuidanceEvidenceCitationProvider

  Drupal\ai_guidance\Evidence\AccessEvidenceProvider:
    tags:
      - { name: guidance_evidence_provider, priority: 50 }

  Drupal\ai_guidance\Evidence\CurrentFormEvidenceProvider:
    arguments:
      $configFactory: '@config.factory'
      $entityFieldManager: '@entity_field.manager'
      $logger: '@logger.channel.ai_guidance'
    tags:
      - { name: guidance_evidence_provider, priority: 45 }

  Drupal\ai_guidance\Evidence\WorkflowEvidenceProvider:
    arguments:
      $configFactory: '@config.factory'
      $moduleHandler: '@module_handler'
      $logger: '@logger.channel.ai_guidance'
    tags:
      - { name: guidance_evidence_provider, priority: 40 }

  Drupal\ai_guidance\Evidence\EcaEvidenceProvider:
    arguments:
      $configFactory: '@config.factory'
      $moduleHandler: '@module_handler'
      $logger: '@logger.channel.ai_guidance'
    tags:
      - { name: guidance_evidence_provider, priority: 20 }

  Drupal\ai_guidance\Evidence\WebformEvidenceProvider:
    arguments:
      $configFactory: '@config.factory'
      $moduleHandler: '@module_handler'
      $logger: '@logger.channel.ai_guidance'
    tags:
      - { name: guidance_evidence_provider, priority: 15 }

  Drupal\ai_guidance\State\CurrentRouteStateProvider:
    arguments:
      $routeMatch: '@current_route_match'
      $currentPath: '@path.current'
      $router: '@router.no_access_checks'
      $accessManager: '@access_manager'
      $currentUser: '@current_user'
      $logger: '@logger.channel.ai_guidance'
    tags:
      - { name: guidance_state_provider, priority: 100 }

  Drupal\ai_guidance\State\CurrentEntityStateProvider:
    arguments:
      $routeMatch: '@current_route_match'
      $currentPath: '@path.current'
      $router: '@router.no_access_checks'
      $entityTypeManager: '@entity_type.manager'
      $logger: '@logger.channel.ai_guidance'
    tags:
      - { name: guidance_state_provider, priority: 90 }

  Drupal\ai_guidance\State\CurrentUserStateProvider:
    arguments:
      $currentUser: '@current_user'
      $configFactory: '@config.factory'
      $permissionHandler: '@?user.permissions'
      $logger: '@logger.channel.ai_guidance'
    tags:
      - { name: guidance_state_provider, priority: 80 }

  Drupal\ai_guidance\State\EnabledModulesStateProvider:
    arguments:
      $moduleHandler: '@module_handler'
    tags:
      - { name: guidance_state_provider, priority: 70 }

  Drupal\ai_guidance\State\AiFeatureStatusProvider:
    arguments:
      $providerPluginManager: '@ai.provider'
      $moduleHandler: '@module_handler'

  Drupal\ai_guidance\Source\HookHelpSourceProvider:
    arguments:
      $moduleHandler: '@module_handler'
      $routeMatch: '@current_route_match'
      $renderer: '@renderer'
      $logger: '@logger.channel.ai_guidance'

  Drupal\ai_guidance\Source\HelpTopicsSourceProvider:
    arguments:
      $helpTopicPluginManager: '@plugin.manager.help_topic'
      $renderer: '@renderer'
      $logger: '@logger.channel.ai_guidance'

  Drupal\ai_guidance\Source\SiteConfigurationSourceProvider:
    arguments:
      $configFactory: '@config.factory'
      $entityTypeManager: '@entity_type.manager'
      $aliasManager: '@?path_alias.manager'
      $logger: '@logger.channel.ai_guidance'
